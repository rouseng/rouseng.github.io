<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>肉僧 · 你好，肉僧</title>
  <!-- 简洁的字体与图标库 (Font Awesome 用于图标) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* 全局重置与基调 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #faf7f2 0%, #f0ece4 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #2e2b28;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    /* 主卡片容器 —— 柔和、干净、略带禅意 */
    .home-card {
      max-width: 840px;
      width: 100%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 56px;
      padding: 2.8rem 2.5rem;
      box-shadow: 
        0 25px 45px -12px rgba(0, 0, 0, 0.15),
        0 2px 10px 0 rgba(0, 0, 0, 0.02),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: all 0.2s ease;
    }

    /* 头部区域：头像 + 问候 */
    .profile-section {
      display: flex;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .avatar-wrapper {
      flex-shrink: 0;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #e8e0d5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 12px 28px -8px rgba(80, 60, 40, 0.25),
        0 0 0 2px rgba(255, 255, 255, 0.8);
      transition: transform 0.2s ease;
    }

    .avatar-wrapper:hover {
      transform: scale(1.02);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
    }

    .greeting h1 {
      font-size: 2.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1f1c19;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }

    .greeting h1 i {
      font-size: 2.2rem;
      color: #b8a48c;
      margin-left: 0.3rem;
      opacity: 0.8;
    }

    .greeting .subhead {
      font-size: 1.1rem;
      color: #6b5f54;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .greeting .subhead .domain {
      background: #ede8df;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #4e443b;
      letter-spacing: 0.3px;
    }

    /* 链接卡片网格 */
    .links-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin: 2.5rem 0 1.2rem;
    }

    .link-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 1.8rem 1.2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 
        0 8px 20px -8px rgba(60, 45, 30, 0.12),
        0 0 0 1px rgba(0, 0, 0, 0.02);
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
    }

    .link-card:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 24px 32px -12px rgba(70, 50, 30, 0.2),
        0 0 0 1px rgba(180, 150, 120, 0.15);
      background: #fffdf9;
    }

    .link-card .icon-bg {
      width: 62px;
      height: 62px;
      background: #f6f1ea;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      transition: background 0.2s ease;
    }

    .link-card:hover .icon-bg {
      background: #eae2d7;
    }

    .link-card i {
      font-size: 2rem;
      color: #735f4b;
      transition: color 0.2s ease;
    }

    .link-card:hover i {
      color: #503f2f;
    }

    .link-card h2 {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #2b241f;
      letter-spacing: -0.01em;
    }

    .link-card p {
      font-size: 0.9rem;
      color: #8c7d6e;
      font-weight: 400;
      line-height: 1.4;
      word-break: break-word;
    }

    /* 脚注 / 额外问候 */
    .footer-note {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.95rem;
      color: #a2917f;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.75rem;
      border-top: 1px solid rgba(170, 150, 130, 0.2);
      padding-top: 1.8rem;
    }

    .footer-note i {
      font-size: 1rem;
      color: #b8a48c;
    }

    .footer-note a {
      color: #8b7a67;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px dotted rgba(139, 122, 103, 0.4);
      transition: color 0.2s, border-color 0.2s;
    }

    .footer-note a:hover {
      color: #4e3f31;
      border-bottom-color: #4e3f31;
    }

    /* 响应式设计 */
    @media (max-width: 680px) {
      .home-card {
        padding: 2rem 1.5rem;
        border-radius: 40px;
      }

      .profile-section {
        gap: 1.2rem;
        flex-direction: column;
        align-items: flex-start;
      }

      .avatar-wrapper {
        width: 96px;
        height: 96px;
      }

      .greeting h1 {
        font-size: 2.2rem;
      }

      .greeting h1 i {
        font-size: 1.8rem;
      }

      .links-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .link-card {
        flex-direction: row;
        justify-content: flex-start;
        text-align: left;
        padding: 1.2rem 1.5rem;
        gap: 1.2rem;
      }

      .link-card .icon-bg {
        width: 50px;
        height: 50px;
        margin-bottom: 0;
        border-radius: 18px;
        flex-shrink: 0;
      }

      .link-card i {
        font-size: 1.6rem;
      }

      .link-card h2 {
        font-size: 1.25rem;
        margin-bottom: 0.1rem;
      }

      .link-card p {
        font-size: 0.85rem;
      }

      .footer-note {
        font-size: 0.85rem;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 400px) {
      .home-card {
        padding: 1.5rem 1rem;
      }

      .greeting h1 {
        font-size: 1.9rem;
      }

      .link-card {
        padding: 1rem 1.2rem;
      }
    }

    /* 小的装饰细节 */
    .greeting .subhead .fa-mug-hot {
      color: #b8a48c;
    }
  </style>
</head>
<body>
  <main class="home-card">
    <!-- 个人资料区 -->
    <div class="profile-section">
      <div class="avatar-wrapper">
        <img class="avatar-img" 
             src="https://avatars.githubusercontent.com/u/7029875?s=600" 
             alt="肉僧头像" 
             loading="lazy">
      </div>
      <div class="greeting">
        <h1>
          你好，肉僧
          <i class="fa-regular fa-hand-peace"></i>
        </h1>
        <div class="subhead">
          <i class="fa-regular fa-compass"></i>
          <span>rouseng.com</span>
          <span class="domain">github.com/rouseng</span>
        </div>
      </div>
    </div>

    <!-- 三个核心链接卡片：项目、笔记、图片 -->
    <div class="links-grid">
      <!-- 项目卡片 -->
      <a href="https://github.com/rouseng?tab=repositories" 
         class="link-card" 
         target="_blank" 
         rel="noopener noreferrer">
        <div class="icon-bg">
          <i class="fa-solid fa-diagram-project"></i>
        </div>
        <h2>项目</h2>
        <p>开源仓库 · 代码作品</p>
      </a>

      <!-- 笔记卡片 -->
      <a href="https://rouseng.com/notes" 
         class="link-card" 
         target="_blank" 
         rel="noopener noreferrer">
        <div class="icon-bg">
          <i class="fa-solid fa-pen-fancy"></i>
        </div>
        <h2>笔记</h2>
        <p>思考 · 记录 · 分享</p>
      </a>

      <!-- 图片卡片 -->
      <a href="https://rouseng.com/photos" 
         class="link-card" 
         target="_blank" 
         rel="noopener noreferrer">
        <div class="icon-bg">
          <i class="fa-regular fa-images"></i>
        </div>
        <h2>图片</h2>
        <p>瞬间 · 光影 · 收藏</p>
      </a>
    </div>

    <!-- 页脚区域：一句问候和主页链接 -->
    <div class="footer-note">
      <i class="fa-regular fa-sun"></i>
      <span>肉僧 · 简单生活，用心编码</span>
      <i class="fa-regular fa-heart" style="color: #b8a48c;"></i>
      <a href="https://rouseng.com" target="_blank" rel="noopener">rouseng.com</a>
    </div>
  </main>

  <!-- 可选: 极小的内联脚本用于年份 (或保留静态) - 不必须，但为了保持干净省略 -->
</body>
</html>
